name: voice_chat_app
description: 小水语音对话 - 像豆包电话一样按住说话
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 语音识别
  speech_to_text: ^7.0.0

  # 音频播放
  audioplayers: ^6.1.0

  # 网络请求
  http: ^1.2.0

  # 状态管理
  provider: ^6.1.0

  # UUID 生成会话ID
  uuid: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
